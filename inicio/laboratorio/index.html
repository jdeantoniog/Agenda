<!DOCTYPE html>
<html lang="es" data-laboratorio>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Laboratorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="../apartados/base.css">
<style>
  /* Solo laboratorio: panel de resultados */
  #lab-panel { border-left: 4px solid var(--focus); }
  #lab-panel ul { list-style: none; margin: 6px 0 10px; padding: 0; font-size: 0.85rem; }
  #lab-panel li { padding: 2px 0; }
  #lab-panel summary { cursor: pointer; font-weight: 700; padding: 4px 0; }
  .lab-res { font-weight: 800; font-size: 1.05rem; margin: 0 0 8px; }
  .lab-bien { color: var(--ok); }
  .lab-mal { color: var(--warn); }
  #lab-panel li.lab-bien { color: var(--ink); }
</style>
</head>
<body>
<!-- LABORATORIO: todos los apartados a la vez, para probar cambios en apartados/ antes de subirlos.
     Las pruebas se ejecutan solas al abrir. ?solo=nombre deja solo un apartado (prueba de independencia). -->
<main>
  <section class="card" id="lab-panel" hidden><p class="status">Ejecutando pruebas…</p></section>
  <div data-apartado="frase"></div>
  <div data-apartado="relojes"></div>
  <div data-apartado="tiempo"></div>
  <div data-apartado="tiempo-buscador"></div>
  <div data-apartado="mapa"></div>
  <div data-apartado="avisos"></div>
  <div data-apartado="calendario"></div>
  <div data-apartado="proximas-fechas"></div>
  <div data-apartado="conversor"></div>
  <div data-apartado="calculadora"></div>
  <div data-apartado="sol-aire"></div>
  <div data-apartado="expresiones"></div>
  <div data-apartado="noticias"></div>
  <div data-apartado="acceso-resto"></div>
  <div data-apartado="pie"></div>
</main>
<div data-apartado="aviso-dia"></div>

<script src="config.js"></script>
<script src="pruebas.js"></script>
<script src="../apartados/cargador.js"></script>
</body>
</html>
